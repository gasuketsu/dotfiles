"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 800
format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$directory\
$vcs\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$os\
$shell\
$character"""

[directory]
fish_style_pwd_dir_length = 1

[username]
format = "[$user]($style) "

[hostname]
format = "[$hostname]($style) "

[localip]
disabled = true

[package]
disabled = true

[vcs]
order = ["jj", "git", "hg"]

[git_metrics]
disabled = true

[jj_bookmark]
symbol = "󱗆 "

[jj_change]
format = "$change\\($commit\\) "

[jj_metrics]
disabled = true

# per-language configuration
[cmake]
format = "[$symbol($version )]($style)"

[golang]
format = "[$symbol($version )]($style)"

[gradle]
symbol = " "
format = "[$symbol($version )]($style)"

[java]
format = "[$symbol($version )]($style)"

[kotlin]
symbol = "󱈙 "
format = "[$symbol($version )]($style)"

[nodejs]
format = "[$symbol($version )]($style)"

[python]
format = "[${symbol} ${pyenv_prefix}${version }(\\($virtualenv\\) )]($style)"

[rust]
format = "[$symbol($version )]($style)"

[lua]
format = "[$symbol($version )]($style)"
